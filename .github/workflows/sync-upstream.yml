name: sync-upstream

# Merge the upstream DS-Bot monorepo into this fork once a day, and open an
# issue when the merge cannot be done automatically.
#
# Files expected to conflict are listed in .github/upstream.json under
# "expected_conflicts"; the Merge step reports which of them actually hit.
# Each is a fork change upstream does not have, so never resolve one side
# wholesale — that silently deletes the fork feature, or loses an upstream fix.
#   steer.js, delivery.js        the steer-cut mark (source.steerCut). Taking
#                                upstream silently removes Bot-to-Bot
#                                interrupting: isCuttingSteer falls back to
#                                kind === 'user' and Bot messages never cut.
#                                Taking ours loses newer delivery fields.
#   groups.js, group-gates.js    gate 1 (no broadcast without a goal) and
#                                gate 2 (relay budget between user messages).
#   goals.js                     adjourn on complete.
#   constants.js                 ROOM_TOPIC_TURN_LIMIT, the gate switch.
#   files.js, resume.js, store.js  durable writes (writeFileDurable, retry).
# Merge both sides, then run `npm test` in ds-bot/.

on:
  schedule:
    - cron: '0 20 * * *'   # 04:00 Asia/Shanghai
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: Upstream branch to merge
        required: false
        default: main

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read upstream config
        id: cfg
        run: |
          url=$(node -p "require('./.github/upstream.json').upstream")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Configure identity and remotes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "${{ steps.cfg.outputs.url }}" || git remote set-url upstream "${{ steps.cfg.outputs.url }}"

      - name: Fetch upstream
        id: fetch
        run: |
          branch="${{ github.event.inputs.upstream_branch || 'main' }}"
          git fetch upstream "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          behind=$(git rev-list --count "HEAD..upstream/$branch")
          echo "behind=$behind" >> "$GITHUB_OUTPUT"

      - name: Merge
        id: merge
        if: steps.fetch.outputs.behind != '0'
        run: |
          branch="${{ steps.fetch.outputs.branch }}"
          if git merge --no-edit "upstream/$branch"; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "clean=false" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt || true
            if [ ! -s /tmp/conflicts.txt ]; then
              git diff --name-only "HEAD..upstream/$branch" > /tmp/conflicts.txt || true
            fi
          fi
          expected=$(node -p "(require('./.github/upstream.json').expected_conflicts||[]).join(' ')")
          hit=""
          for f in $expected; do
            if grep -qx "$f" /tmp/conflicts.txt; then hit="$hit$f "; fi
          done
          if [ -n "$hit" ]; then echo "Expected fork conflicts hit: $hit"; fi

      - name: Push the merge
        if: steps.merge.outputs.clean == 'true'
        run: git push origin HEAD:main

      - name: Open an issue when the merge conflicts
        if: steps.fetch.outputs.behind != '0' && steps.merge.outputs.clean == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const conflicts = fs.readFileSync('/tmp/conflicts.txt', 'utf8').trim() || '(could not list files)'
            const title = `upstream sync needs a human (behind by ${{ steps.fetch.outputs.behind }})`
            const body = [
              `Merging \`upstream/${{ steps.fetch.outputs.branch }}\` conflicted.`,
              '',
              'Files involved:',
              '```',
              conflicts,
              '```',
              '',
              'Resolve by hand, keeping both sides. Every file below is a fork change',
              'upstream does not have, so taking upstream side for a whole file silently',
              'deletes it:',
              '',
              '| File | What must survive |',
              '| --- | --- |',
              '| `steer.js`, `delivery.js` | `isCuttingSteer` and its four call sites, plus any new `source` field upstream added |',
              '| `groups.js`, `group-gates.js` | gate 1 (no broadcast without a goal) and gate 2 (relay budget) |',
              '| `goals.js` | `adjourn(room)` when a goal reaches complete |',
              '| `constants.js` | `ROOM_TOPIC_TURN_LIMIT`, `ROOM_REQUIRE_GOAL_FOR_BROADCAST` |',
              '| `files.js`, `resume.js`, `store.js` | `writeFileDurable` / `replaceFile` retry |',
              '',
              'Then run `npm test` in `ds-bot/`. The baseline on a clean checkout here reads',
              '23 pass / 5 fail in `group-goal` and 79 pass / 1 fail in `group-work`; those',
              'failures pre-exist in this environment. Anything beyond them is this merge.',
              '',
              'See FORK.md and the patch bank under dsbot-patches/.',
            ].join('\n')
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'upstream-sync',
            })
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['upstream-sync'],
              })
            }
